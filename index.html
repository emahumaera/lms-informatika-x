<script>
    // ============================================================
    //  SUPABASE INITIALIZATION
    // ============================================================
    const SUPABASE_URL = 'https://gbfcgapcfpihhgdhakjd.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_czXnEOXu4dDc34CbUrhBtw_o7KetzcD';
    const supabaseClient = (window.supabase && window.supabase.createClient) ?
        window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY) :
        null;
    const _supabase = supabaseClient;

    // ============================================================
    //  DATA AWAL & LOCAL FALLBACK
    // ============================================================
    const listMuridTetap = [
        "ABHIYASA PUTRA ALDARYFANI", "ANANDA VITTO ADITYA PUTRA", "ARYA DWI PANDU WICAKSONO",
        "AURELIO BARCA ADIWANGSA", "DAVID ALLEN ANUGERAH", "LUTFAN MACHUS NUGROHO",
        "MUHAMAD TEGUH FEBRIYANSYAH", "MUHAMMAD ABDUL DAWWAS", "MUHAMMAD ABIEL PUTRA WIBOWO",
        "MUHAMMAD ALDAFA SAPUTRA", "MUHAMMAD ANGGAS FAHRI IRAWAN", "MUHAMMAD BISMA BRILLIAN SAPTOTO",
        "MUHAMMAD CEVIN PUTRA MEDA", "MUHAMMAD DAFA FEBRIAN WAHNURI", "MUHAMMAD FAHRI NUR AZZAM",
        "MUHAMMAD HUDA PUTRA MUDANTO", "MUHAMMAD JUNIOR FARHAN WAHYUDI", "MUHAMMAD ZAKI PERMANA",
        "NATANELIA AZZARIA ALYUSUF", "NAYLA MAHARDIKA PRASASTI", "NUR EVAN SATRIA PRATAMA",
        "NURUL USWAHTUN HASANAH", "PANDU RYAN PAMUNGKAS", "QIENKIN AURELIN AMANDA",
        "RADITYA LISTIAN PRASETYO", "RAFA PRATAMA SAPUTRA", "RAY MAHENDRA PUTRA",
        "RETNO NAWANG SARI", "RIRIN LESTARI", "RISANG RAMADHAN", "SRI LESTARI",
        "TEGAR PUTRA PRASTIKA", "WIJDAN PRIYA PRATAMA", "YORDAN HAFIS YUDISTIRA",
        "ZAMIR ALFAD GTHA"
    ];

    let APP_DATA = JSON.parse(localStorage.getItem('LMS_EMA_DATA_V10')) || {
        students: [...listMuridTetap],
        pertemuan: [],
        submissions: [],
        grades: [],
        absensi: {},
        absensiDates: {},
        kuisList: [],
        kuisScores: []
    };

    if (!APP_DATA.students || APP_DATA.students.length === 0) {
        APP_DATA.students = [...listMuridTetap];
        saveDB();
    }

    let currentUser = null;
    let soalKuisTemp = [];
    let isDataLoadedFromSupabase = false;

    // ============================================================
    //  UTILITY FUNCTIONS
    // ============================================================
    function normalizeName(str) {
        return (str || '').toString().trim().toUpperCase();
    }

    function parseSoalSafely(soalData) {
        if (!soalData) return [];
        let parsed = soalData;
        try {
            while (typeof parsed === 'string') {
                parsed = JSON.parse(parsed);
            }
        } catch (e) {
            console.error("Gagal parse JSON soal:", e);
            return [];
        }
        return Array.isArray(parsed) ? parsed : [];
    }

    function parseDescWithGameUrl(descRaw) {
        if (!descRaw) return { desc: '', game_url: '' };
        try {
            const obj = JSON.parse(descRaw);
            if (typeof obj === 'object' && obj !== null) {
                return { desc: obj.desc || '', game_url: obj.game_url || '' };
            }
        } catch (_) { /* bukan JSON */ }
        return { desc: descRaw, game_url: '' };
    }

    function saveDB() {
        try {
            localStorage.setItem('LMS_EMA_DATA_V10', JSON.stringify(APP_DATA));
        } catch (_) { /* ignore */ }
    }

    function showToast(message, isError = false) {
        const container = document.getElementById('toast-container');
        if (!container) return;
        const toast = document.createElement('div');
        toast.className = 'toast' + (isError ? ' error' : '');
        toast.innerText = message;
        container.appendChild(toast);
        setTimeout(() => toast.classList.add('show'), 10);
        setTimeout(() => {
            toast.classList.remove('show');
            setTimeout(() => { if (container.contains(toast)) container.removeChild(toast); }, 300);
        }, 4000);
    }

    function showNotification(msg, title = "Informasi LMS", isError = false) {
        showToast(`${title}: ${msg}`, isError);
    }

    function readFileAsBase64(file) {
        return new Promise((resolve, reject) => {
            if (!file) resolve(null);
            else {
                const reader = new FileReader();
                reader.onload = () => resolve({ name: file.name, type: file.type, data: reader.result });
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            }
        });
    }

    function handleSupabaseError(error, actionName) {
        if (!error) return false;
        console.error(`Supabase Error (${actionName}):`, error);
        if (error.code === '42501' || error.message.includes('permission') || error.message.includes('policy')) {
            showToast(`Peringatan Supabase (${actionName}): Izin ditolak RLS. Aktifkan RLS Policy di Supabase Dashboard.`, true);
        } else {
            showToast(`Peringatan Supabase (${actionName}): ${error.message || 'Gagal menyimpan'}`, true);
        }
        return true;
    }

    // ============================================================
    //  LOAD SUPABASE DATA - DIPERBAIKI DENGAN TIMEOUT 60 DETIK
    // ============================================================
    async function loadAllDataFromSupabase() {
        if (!_supabase) {
            console.warn("Supabase Client tidak diinisialisasi. Memakai localStorage.");
            isDataLoadedFromSupabase = true;
            return;
        }

        // ⭐ PERBAIKAN: Timeout dinaikkan menjadi 60000ms (60 detik)
        const fetchWithTimeout = (promise, ms = 60000) => {
            return Promise.race([
                promise,
                new Promise((_, reject) => setTimeout(() => reject(new Error("Database Timeout")), ms))
            ]);
        };

        try {
            console.log("🔄 Memuat data dari Supabase (timeout 60 detik)...");

            const [stRes, pRes, subRes, absRes, kuisRes, qaRes] = await Promise.allSettled([
                fetchWithTimeout(_supabase.from('students').select('*').order('id', { ascending: true })),
                fetchWithTimeout(_supabase.from('pertemuan').select('*').order('id', { ascending: true })),
                fetchWithTimeout(_supabase.from('submissions').select('*').order('id', { ascending: false })),
                fetchWithTimeout(_supabase.from('absensi').select('*')),
                fetchWithTimeout(_supabase.from('kuis').select('*').order('created_at', { ascending: false })),
                fetchWithTimeout(_supabase.from('quiz_attempts').select('*'))
            ]);

            // ----- SISWA -----
            if (stRes.status === 'fulfilled' && stRes.value.data && stRes.value.data.length > 0) {
                const fetchedNames = stRes.value.data.map(s => s.nama_siswa || s.nama).filter(Boolean);
                if (fetchedNames.length > 0) {
                    APP_DATA.students = Array.from(new Set([...listMuridTetap, ...fetchedNames.map(normalizeName)]));
                }
            }
            if (!APP_DATA.students || APP_DATA.students.length === 0) {
                APP_DATA.students = [...listMuridTetap];
            }

            // ----- PERTEMUAN (MERGE) -----
            if (pRes.status === 'fulfilled' && pRes.value.data && pRes.value.data.length > 0) {
                const localMap = new Map();
                (APP_DATA.pertemuan || []).forEach(p => localMap.set(p.id, p));

                pRes.value.data.forEach(p => {
                    const id = p.id;
                    let parsedMateriFile = null;
                    let parsedLkpdFile = null;

                    if (typeof p.materi_file === 'string') {
                        try { parsedMateriFile = JSON.parse(p.materi_file); } catch (_) { parsedMateriFile = p.materi_file; }
                    } else {
                        parsedMateriFile = p.materi_file || null;
                    }
                    if (typeof p.lkpd_file === 'string') {
                        try { parsedLkpdFile = JSON.parse(p.lkpd_file); } catch (_) { parsedLkpdFile = p.lkpd_file; }
                    } else {
                        parsedLkpdFile = p.lkpd_file || null;
                    }

                    if (localMap.has(id)) {
                        const existing = localMap.get(id);
                        existing.judul = p.judul || existing.judul;
                        existing.materiText = p.materi_text || p.materiText || existing.materiText;
                        existing.lkpdText = p.lkpd_text || p.lkpdText || existing.lkpdText;
                        existing.lkpdLink = p.lkpd_link || p.lkpdLink || existing.lkpdLink;
                        if (!existing.materiFile && parsedMateriFile) existing.materiFile = parsedMateriFile;
                        if (!existing.lkpdFile && parsedLkpdFile) existing.lkpdFile = parsedLkpdFile;
                    } else {
                        localMap.set(id, {
                            id: id,
                            judul: p.judul,
                            materiText: p.materi_text || p.materiText || '',
                            materiFile: parsedMateriFile,
                            lkpdText: p.lkpd_text || p.lkpdText || '',
                            lkpdLink: p.lkpd_link || p.lkpdLink || '',
                            lkpdFile: parsedLkpdFile
                        });
                    }
                });
                APP_DATA.pertemuan = Array.from(localMap.values());
            }

            // ----- ⭐ SUBMISSIONS (RESET ULANG AGAR DATA TERBARU) -----
            if (subRes.status === 'fulfilled' && subRes.value.data) {
                console.log(`📥 Memuat ${subRes.value.data.length} submission dari Supabase`);
                
                // Reset submissions lokal
                APP_DATA.submissions = [];
                
                subRes.value.data.forEach(s => {
                    const namaSiswa = s.nama_siswa || s.namaSiswa || s.student_name || '';
                    const jawaban = s.jawaban || s.Jawaban || s.answer || '';
                    const pertemuanId = s.pertemuan_id || s.pertemuanId || s.meeting_id || '';
                    const nilai = s.nilai !== undefined ? s.nilai : (s.score || 0);
                    const catatan = s.catatan || s.note || '';
                    const submittedAt = s.submitted_at || s.submittedAt || s.created_at || new Date().toISOString();

                    let parsedJawaban = jawaban;
                    if (typeof jawaban === 'string') {
                        try {
                            const parsed = JSON.parse(jawaban);
                            if (parsed && typeof parsed === 'object') {
                                parsedJawaban = parsed;
                            }
                        } catch (_) { /* bukan JSON */ }
                    }

                    APP_DATA.submissions.push({
                        id: s.id,
                        pertemuan_id: pertemuanId,
                        pertemuanId: pertemuanId,
                        nama_siswa: normalizeName(namaSiswa),
                        namaSiswa: normalizeName(namaSiswa),
                        jawaban: parsedJawaban,
                        Jawaban: parsedJawaban,
                        nilai: parseInt(nilai) || 0,
                        catatan: catatan || '',
                        submitted_at: submittedAt
                    });
                });

                console.log(`✅ ${APP_DATA.submissions.length} submission berhasil dimuat`);
            } else {
                console.warn("⚠️ Gagal memuat submissions:", subRes);
            }

            // ----- ABSENSI -----
            if (absRes.status === 'fulfilled' && absRes.value.data) {
                if (!APP_DATA.absensi) APP_DATA.absensi = {};
                absRes.value.data.forEach(item => {
                    const nama = normalizeName(item.nama_siswa || item.namaSiswa);
                    const col = item.pertemuan_id || item.pertemuanId;
                    const status = item.status_kehadiran || item.status;
                    if (nama && col) {
                        if (!APP_DATA.absensi[nama]) APP_DATA.absensi[nama] = {};
                        APP_DATA.absensi[nama][col] = status;
                    }
                });
            }

            // ----- KUIS -----
            if (kuisRes.status === 'fulfilled' && kuisRes.value.data && kuisRes.value.data.length > 0) {
                APP_DATA.kuisList = kuisRes.value.data.map(k => {
                    const parsed = parseDescWithGameUrl(k.desc || k.deskripsi || '');
                    return {
                        id: k.id,
                        kategori: k.kategori,
                        judul: k.judul,
                        desc: parsed.desc,
                        game_url: parsed.game_url,
                        soal: parseSoalSafely(k.soal),
                        created_at: k.created_at
                    };
                });
            }

            // ----- SKOR KUIS -----
            if (qaRes.status === 'fulfilled' && qaRes.value.data) {
                APP_DATA.kuisScores = qaRes.value.data.map(q => ({
                    id: q.id,
                    studentName: normalizeName(q.student_name || q.studentName),
                    quizId: q.quiz_id || q.quizId,
                    quizTitle: q.quiz_title || q.quizTitle,
                    score: q.score,
                    totalCorrect: q.total_correct !== undefined ? q.total_correct : q.totalCorrect,
                    totalWrong: q.total_wrong !== undefined ? q.total_wrong : q.totalWrong,
                    submittedAt: q.submitted_at || q.submittedAt
                }));
            }

            saveDB();
            isDataLoadedFromSupabase = true;
            console.log("✅ Semua data Supabase berhasil dimuat & di-merge!");

            // 🔄 Refresh tampilan jika sudah login
            if (currentUser) {
                if (currentUser.role === 'siswa') {
                    loadRekapPortofolioSiswa();
                } else {
                    renderPortofolioTable();
                    renderDaftarPertemuanGuru();
                }
            }

        } catch (err) {
            console.warn("❌ Gagal terhubung ke Supabase, menggunakan lokal:", err);
            if (!APP_DATA.students || APP_DATA.students.length === 0) {
                APP_DATA.students = [...listMuridTetap];
                saveDB();
            }
            isDataLoadedFromSupabase = true;
        }
    }

    // ============================================================
    //  FUNGSI REFRESH DATA (UNTUK DEBUGGING)

    async function refreshDataFromSupabase() {
        showToast("🔄 Memuat ulang data dari Supabase...");
        await loadAllDataFromSupabase();
        if (currentUser) {
            if (currentUser.role === 'siswa') {
                loadRekapPortofolioSiswa();

                loadRiwayatKuisSiswa();
            } else {
                renderPortofolioTable();
                renderDaftarPertemuanGuru();
                renderAbsensiMatrix();
                renderRekapAbsensiGuru();
            }
        }
        showToast("✅ Data berhasil dimuat ulang!");
    }
    window.refreshDataFromSupabase = refreshDataFromSupabase;

    // ============================================================
    //  AUTENTIKASI & LOGIN
    // ============================================================
    function switchLogin(role) {
        const tabsS = document.getElementById('tabSiswaBtn');
        const tabsG = document.getElementById('tabGuruBtn');
        const formSiswa = document.getElementById('formSiswa');
        const formGuru = document.getElementById('formGuru');

        if (!tabsS || !tabsG || !formSiswa || !formGuru) return;

        if (role === 'siswa') {
            tabsS.classList.add('active');
            tabsG.classList.remove('active');
            formSiswa.style.display = 'block';
            formGuru.style.display = 'none';
        } else {
            tabsG.classList.add('active');
            tabsS.classList.remove('active');
            formSiswa.style.display = 'none';
            formGuru.style.display = 'block';
        }
    }
    window.switchLogin = switchLogin;

    async function loginSiswa(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSubmitSiswa');
        const inputName = document.getElementById('inputNamaSiswaLogin');
        const normInput = normalizeName(inputName.value);
        btn.disabled = true;
        btn.innerHTML = `<span class="spinner"></span> Memverifikasi...`;
        try {
            if (!isDataLoadedFromSupabase) await loadAllDataFromSupabase();
            if (!APP_DATA.students || APP_DATA.students.length === 0) {
                APP_DATA.students = [...listMuridTetap];
                saveDB();
            }
            const found = APP_DATA.students.find(s => normalizeName(s) === normInput);
            if (found) {
                currentUser = { role: 'siswa', name: found };
                await initApp();
                inputName.value = '';
            } else {
                showNotification(`Nama "${inputName.value}" tidak ditemukan.`, 'Akses Ditolak', true);
                inputName.focus();
                inputName.select();
            }
        } catch (err) {
            console.error("Error login siswa:", err);
            showNotification("Terjadi kesalahan, coba lagi.", 'Error', true);
        } finally {
            btn.disabled = false;
            btn.innerHTML = 'Masuk Pembelajaran';
        }
    }
    window.loginSiswa = loginSiswa;

    async function loginGuru(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSubmitGuru');
        const pin = document.getElementById('inputPinGuru').value;
        if (pin === 'guru123') {
            btn.disabled = true;
            btn.innerHTML = `<span class="spinner"></span> Membuka Panel...`;
            try {
                if (!isDataLoadedFromSupabase) await loadAllDataFromSupabase();
                currentUser = { role: 'guru', name: 'Bu Ema Humaera' };
                await initApp();
                document.getElementById('inputPinGuru').value = '';
            } catch (err) {
                console.error(err);
                showNotification("Gagal membuka panel.", 'Error', true);
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Masuk Panel Guru';
            }
        } else {
            showNotification('PIN Akses Guru Salah!', 'Akses Ditolak', true);
            document.getElementById('inputPinGuru').focus();
            document.getElementById('inputPinGuru').select();
        }
    }
    window.loginGuru = loginGuru;

    function logout() {
        currentUser = null;
        document.getElementById('loginModal').style.display = 'flex';
        document.getElementById('inputNamaSiswaLogin').value = '';
        document.getElementById('inputPinGuru').value = '';
        // Reset tampilan
        document.querySelectorAll('.section').forEach(s => {
            s.classList.remove('active');
            s.style.display = 'none';
        });
    }
    window.logout = logout;

    // ============================================================
    //  INIT APPLIKASI
    // ============================================================
    async function initApp() {
        document.getElementById('loginModal').style.display = 'none';
        const nav = document.getElementById('navbarMenu');
        const badge = document.getElementById('userBadge');
        
        // Pastikan data terbaru
        if (!isDataLoadedFromSupabase) {
            await loadAllDataFromSupabase();
        }

        if (currentUser.role === 'siswa') {
            badge.innerHTML = `<span>👤</span> ${currentUser.name}`;
            nav.innerHTML = `
                <button class="nav-btn active" onclick="showSection('s_beranda', this)">Beranda</button>
                <button class="nav-btn" onclick="showSection('s_materi', this)">Materi Ajar</button>
                <button class="nav-btn" onclick="showSection('s_tugas', this)">Tugas LKPD</button>
                <button class="nav-btn" onclick="showSection('s_kuis', this)">Asesmen</button>
                <button class="nav-btn" onclick="showSection('s_portofolio', this)">Portofolio Saya</button>

        } else {
            badge.innerHTML = `<span>👩‍🏫</span> Guru: Bu Ema Humaera`;
            nav.innerHTML = `
                <button class="nav-btn active" onclick="showSection('g_portofolio', this)">Portofolio Murid</button>
                <button class="nav-btn" onclick="showSection('g_daftar_pertemuan', this)">Modul Materi</button>
                <button class="nav-btn" onclick="showSection('g_kelola', this)">+ Buat Pertemuan</button>
                <button class="nav-btn" onclick="showSection('g_kuis', this)">Kelola Asesmen</button>
                <button class="nav-btn" onclick="showSection('g_siswa', this)">Data Murid</button>
                <button class="nav-btn" onclick="showSection('g_absensi', this)">Absensi</button>
                <button class="nav-btn btn-logout" onclick="logout()">Keluar</button>
            `;
            showSection('g_portofolio');
            renderDaftarPertemuanGuru();
            renderDaftarSiswaTable();
            initAbsensiHeaders();
            renderAbsensiMatrix();
            renderRekapAbsensiGuru();
            renderPortofolioTable();
            switchKuisKategoriGuru('Asesmen Diagnostik', document.querySelector('#g_kuis .login-tab button'));
        }
    }

    function showSection(sectionId, btn) {
        document.querySelectorAll('.section').forEach(s => {
            s.classList.remove('active');
            s.style.display = 'none';
        });
        const target = document.getElementById(sectionId);
        if (target) {
            target.classList.add('active');
            target.style.display = 'block';
            try {
                if (sectionId === 's_portofolio') loadRekapPortofolioSiswa();
                else if (sectionId === 's_kuis') loadRiwayatKuisSiswa();
                else if (sectionId === 'g_absensi') { renderAbsensiMatrix(); renderRekapAbsensiGuru(); }
                else if (sectionId === 'g_portofolio') renderPortofolioTable();
                else if (sectionId === 's_materi') loadMateriSiswa();
            } catch (err) { console.warn("Error di showSection:", err); }
        }
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        if (btn) btn.classList.add('active');
    }
    window.showSection = showSection;

    // ============================================================
    //  MODUL PERTEMUAN (MATERI & LKPD)
    // ============================================================
    async function simpanPertemuanBaru(e) {
        e.preventDefault();
        const judul = document.getElementById('g_judulPertemuan').value;
        const materiText = document.getElementById('g_materiText').value;
        const lkpdText = document.getElementById('g_lkpdText').value;
        const lkpdLink = document.getElementById('g_lkpdLink').value;
        const materiFile = await readFileAsBase64(document.getElementById('g_materiFile').files[0]);
        const lkpdFile = await readFileAsBase64(document.getElementById('g_lkpdFile').files[0]);
        
        const newP = { 
            id: Math.floor(Date.now() / 1000), 
            judul, 
            materiText, 
            materiFile, 
            lkpdText, 
            lkpdLink, 
            lkpdFile 
        };
        
        if (!APP_DATA.pertemuan) APP_DATA.pertemuan = [];
        APP_DATA.pertemuan.push(newP);
        saveDB();

        if (_supabase) {
            const { data, error } = await _supabase.from('pertemuan').insert([{
                id: newP.id,
                judul: newP.judul,
                materi_text: newP.materiText,
                materi_file: newP.materiFile ? JSON.stringify(newP.materiFile) : null,
                lkpd_text: newP.lkpdText,
                lkpd_link: newP.lkpdLink,
                lkpd_file: newP.lkpdFile ? JSON.stringify(newP.lkpdFile) : null
            }]);
            
            if (!handleSupabaseError(error, "Simpan Pertemuan")) {
                showToast('Pertemuan baru berhasil tersimpan ke Supabase & Lokal!');
            }
        } else {
            showToast('Pertemuan baru berhasil disimpan (Lokal)!');
        }

        e.target.reset();
        renderDaftarPertemuanGuru();
        populatePertemuanSiswaSelects();
    }
    window.simpanPertemuanBaru = simpanPertemuanBaru;

    // ============================================================
    //  FUNGSI UNTUK MENAMPILKAN FILE MATERI (HANYA NAMA FILE DI TABEL GURU)
    // ============================================================
    function generateMaterialPreviewHtml(p) {
        let html = `<div class="preview-container">`;
        if (p.materiText && p.materiText.trim() !== '') {
            html += `<p style="margin-bottom:8px;">${p.materiText}</p>`;
        }
        const fileData = p.materiFile;
        if (fileData) {
            let fileName = 'Bahan_Ajar';
            if (typeof fileData === 'object' && fileData !== null && fileData.name) {
                fileName = fileData.name;
            } else if (typeof fileData === 'string' && fileData.startsWith('data:')) {
                const match = fileData.match(/^data:([^;]+);/);
                if (match) {
                    const ext = match[1].split('/')[1] || 'file';
                    fileName = `Lampiran.${ext}`;
                }
            }
            html += `<div style="margin-top:6px;"><span style="font-weight:600; color:var(--primary-purple);">📎 ${fileName}</span></div>`;
        }
        if (!p.materiText && !p.materiFile) {
            html += `<span style="color:#999; font-style:italic;">Tidak ada materi/teks kosong</span>`;
        }
        html += `</div>`;
        return html;
    }

    function renderDaftarPertemuanGuru() {
        const container = document.getElementById('tabelDaftarPertemuanGuru');

    // ============================================================
    //  FUNGSI GENERATE MATERI UNTUK SISWA (TAMPILKAN FILE LENGKAP)
    // ============================================================
    function generateMaterialHTML(p) {
        let html = `<div class="card"><h3 style="color:var(--primary-purple); font-weight:700; margin-bottom:12px;">${p.judul}</h3>`;
        let hasContent = false;

        if (p.materiText && p.materiText.trim() !== '') {
            html += `<p style="line-height:1.6; margin-bottom:15px;">${p.materiText}</p>`;
            hasContent = true;
        }

        const fileData = p.materiFile;
        if (fileData) {
            let base64Data = null;
            let fileName = 'Bahan_Ajar';
            let fileType = '';

            if (typeof fileData === 'object' && fileData !== null && fileData.data) {
                base64Data = fileData.data;
                fileName = fileData.name || 'Bahan_Ajar';
                fileType = fileData.type || '';
            } else if (typeof fileData === 'string' && fileData.startsWith('data:')) {
                base64Data = fileData;
                const match = fileData.match(/^data:(image\/[a-z]+|application\/pdf|application\/msword|application\/vnd\.openxmlformats-officedocument\.wordprocessingml\.document);base64,/);
                if (match) fileType = match[1];
                else fileType = 'application/octet-stream';
            }

            if (base64Data) {
                if (fileType.startsWith('image/')) {
                    html += `<img src="${base64Data}" class="img-preview" style="width:100%; height:auto; max-height:500px; object-fit:contain;" alt="Materi">`;
                    hasContent = true;
                } else if (fileType === 'application/pdf') {
                    html += `<iframe src="${base64Data}" style="width:100%; height:600px; border:1px solid #ddd; border-radius:12px;" frameborder="0"></iframe>`;
                    html += `<div style="margin-top:12px;"><a href="${base64Data}" download="${fileName}" class="file-link">⬇️ Unduh File / Lampiran: ${fileName}</a></div>`;
                    hasContent = true;
                } else if (base64Data) {
                    html += `<a href="${base64Data}" download="${fileName}" class="file-link">⬇️ Unduh File / Lampiran: ${fileName}</a>`;
                    hasContent = true;
                }
            }
        }

        if (!hasContent) {
            html += `<div class="text-center p-6 text-gray-500 italic bg-gray-50 rounded-lg border border-dashed border-gray-300">Belum ada lampiran materi untuk pertemuan ini.</div>`;
        }
        html += `</div>`;
        return html;
    }

    async function submitTugasBiasa(e, idPertemuan) {
        e.preventDefault();
        const fileInput = document.getElementById('fileTugasSiswa');
        const catatanInput = document.getElementById('catatanTugasSiswa');
        const file = fileInput ? fileInput.files[0] : null;
        if (!file) return showToast("Pilih file terlebih dahulu!", true);
        const base64 = await readFileAsBase64(file);
        const namaSiswa = currentUser ? normalizeName(currentUser.name) : "SISWA";
        const p = APP_DATA.pertemuan.find(x => x.id == idPertemuan);
        const hasLkpdLink = p && p.lkpdLink && p.lkpdLink.trim() !== '';
        let catatanFinal = catatanInput ? catatanInput.value : '';
        if (hasLkpdLink) catatanFinal = (catatanFinal ? catatanFinal + ' | ' : '') + 'Bukti LKPD online';
        
        const payload = {
            id: Math.floor(Date.now() / 1000),
            pertemuan_id: idPertemuan,
            pertemuanId: idPertemuan,
            nama_siswa: namaSiswa,
            namaSiswa: namaSiswa,
            jawaban: JSON.stringify(base64),
            Jawaban: JSON.stringify(base64),
            nilai: 0,
            catatan: catatanFinal,
            submitted_at: new Date().toLocaleString('id-ID')
        };

        if (!APP_DATA.submissions) APP_DATA.submissions = [];
        APP_DATA.submissions.push(payload);
        saveDB();

        if (_supabase) {
            let { data, error } = await _supabase.from('submissions').insert([{
                id: payload.id,
                pertemuan_id: idPertemuan,
                nama_siswa: namaSiswa,
                jawaban: payload.jawaban,
                nilai: 0,
                catatan: payload.catatan,
                submitted_at: payload.submitted_at
            }]);

            if (error) {
                const { error: err2 } = await _supabase.from('submissions').insert([{
                    id: payload.id,
                    pertemuan_id: idPertemuan,
                    nama_siswa: namaSiswa,
                    Jawaban: payload.jawaban,
                    nilai: 0,
                    catatan: payload.catatan,
                    submitted_at: payload.submitted_at
                }]);
                handleSupabaseError(err2, "Kirim Tugas");
            }
        }

        showToast(hasLkpdLink ? "Bukti LKPD berhasil dikirim!" : "Jawaban berhasil terkirim!");
        
        // Refresh data dari Supabase agar sinkron
        await loadAllDataFromSupabase();
        loadRekapPortofolioSiswa();
        loadTugasSiswa();
    }
    window.submitTugasBiasa = submitTugasBiasa;

    function renderJawabanSiswa(jawabanRaw) {
        if (!jawabanRaw) return "<i>Belum ada jawaban</i>";
        try {
            let parsed = jawabanRaw;
            if (typeof parsed === 'string') {
                try { parsed = JSON.parse(parsed); } catch (_) {}
            }
            if (parsed && typeof parsed === 'object') {
                if (parsed.type === 'link' || parsed.url) {
                    return `<a href="${parsed.url}" target="_blank" style="color: #7c3aed; font-weight:600;">🔗 Tautan Tugas</a>`;
                } else if (parsed.data) {
                    const fileName = parsed.name || 'tugas';
                    let downloadLink = parsed.data;
                    if (!downloadLink.startsWith('data:')) {
                        try {
                            const blob = new Blob([downloadLink]);
                            downloadLink = URL.createObjectURL(blob);
                        } catch (_) {
                            return `<span style="color:red;">Format file tidak dikenali</span>`;
                        }
                    }
                    let previewHTML = '';
                    if (parsed.type && parsed.type.startsWith('image/')) {
                        previewHTML = `<img src="${downloadLink}" style="max-width:100px; max-height:100px; border-radius:8px; display:block; margin-bottom:8px;" alt="Tugas">`;
                    }
                    return `${previewHTML}<a href="${downloadLink}" download="${fileName}" class="file-link download-btn" style="font-size:11px;">⬇️ File (${fileName})</a>`;
                }
            }
            if (typeof jawabanRaw === 'string' && jawabanRaw.length < 200) {
                return `<span style="color:var(--text-dark);">${jawabanRaw}</span>`;
            }
        } catch (_) { return `<span style="color:red;">Format file tidak dikenali</span>`; }
        return jawabanRaw;
    }

    function renderAbsensiMatrix() {
        const tbody = document.getElementById('tabelMatriksAbsensiBody');
        if (!tbody) return;
        tbody.innerHTML = '';
        let studentsList = (APP_DATA.students && APP_DATA.students.length > 0) ? APP_DATA.students : [...listMuridTetap];
        APP_DATA.students = Array.from(new Set(studentsList.map(normalizeName)));
        APP_DATA.students.slice().sort().forEach(nama => {
            if (!APP_DATA.absensi) APP_DATA.absensi = {};
            if (!APP_DATA.absensi[nama]) APP_DATA.absensi[nama] = {};
            let rowHTML = `<tr><td class="sticky-col-cell">${nama}</td>`;
            let h = 0;
            for (let col = 1; col <= 30; col++) {
                const status = APP_DATA.absensi[nama][col] || '-';
                if (status === 'H') h++;
                rowHTML += `<td class="absensi-cell" onclick="toggleAbsensi('${encodeURIComponent(nama)}', ${col})">${status}</td>`;
            }
            rowHTML += `<td style="font-weight:600; color:var(--primary-purple); text-align:center;">${Math.round((h / 30) * 100)}%</td></tr>`;

    async function toggleAbsensi(namaEnc, col) {
        const nama = decodeURIComponent(namaEnc);
        const states = ["-", "H", "S", "I", "A"];
        const current = (APP_DATA.absensi[nama] && APP_DATA.absensi[nama][col]) || "-";
        const nextIdx = (states.indexOf(current) + 1) % states.length;
        const newStatus = states[nextIdx];
        if (!APP_DATA.absensi) APP_DATA.absensi = {};
        if (!APP_DATA.absensi[nama]) APP_DATA.absensi[nama] = {};
        APP_DATA.absensi[nama][col] = newStatus;
        saveDB();
        renderAbsensiMatrix();
        renderRekapAbsensiGuru();

        if (_supabase) {
            const { error } = await _supabase.from('absensi').upsert({
                nama_siswa: nama,
                pertemuan_id: col.toString(),
                status_kehadiran: newStatus
            }, { onConflict: 'nama_siswa,pertemuan_id' });

            if (error) {
                await _supabase.from('absensi').delete().eq('nama_siswa', nama).eq('pertemuan_id', col.toString());
                const { error: errInsert } = await _supabase.from('absensi').insert([{
                    nama_siswa: nama,
                    pertemuan_id: col.toString(),
                    status_kehadiran: newStatus
                }]);
                handleSupabaseError(errInsert, "Update Absensi");
            }
        }
    }

    function getAttendanceDataForExport() {
        const students = (APP_DATA.students && APP_DATA.students.length > 0) ? APP_DATA.students : [...listMuridTetap];
        const rows = [];
        const header = ['Nama Murid'];
        for (let col = 1; col <= 30; col++) {
            const date = (APP_DATA.absensiDates && APP_DATA.absensiDates[col]) ? APP_DATA.absensiDates[col] : '';
            header.push(`P${col}${date ? ' ('+date+')' : ''}`);
        }
        header.push('Hadir', 'Sakit', 'Izin', 'Alfa', '% Kehadiran');
        rows.push(header);

        students.slice().sort().forEach(nama => {
            const row = [nama];
            let h = 0, s = 0, i = 0, a = 0;
            for (let col = 1; col <= 30; col++) {
                const status = (APP_DATA.absensi && APP_DATA.absensi[nama] && APP_DATA.absensi[nama][col]) ? APP_DATA.absensi[nama][col] : '-';
                row.push(status);
                if (status === 'H') h++;
                else if (status === 'S') s++;
                else if (status === 'I') i++;
                else if (status === 'A') a++;
            }
            row.push(h, s, i, a, Math.round((h / 30) * 100) + '%');
            rows.push(row);
        });
        return rows;
    }

    function downloadRekapAbsensiCSV() {
        const data = getAttendanceDataForExport();
        let csv = '';
        data.forEach(row => {
            csv += row.map(v => `"${v}"`).join(',') + '\n';
        });
        const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `Rekap_Absensi_Kelas_X_Keramik_A_${new Date().toISOString().slice(0,10)}.csv`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast('CSV Rekap Absensi berhasil diunduh!');
    }
    window.downloadRekapAbsensiCSV = downloadRekapAbsensiCSV;

        const desc = document.getElementById('g_kuisDesc').value;
        const game_url = document.getElementById('g_kuisGameUrl').value;

        const container = document.getElementById('containerSoalGuru');
        const soalCards = container.querySelectorAll('.card');

        soalCards.forEach((card, idx) => {

            const optB = card.querySelector('.soal-optB').value;
            const optC = card.querySelector('.soal-optC').value;
            const optD = card.querySelector('.soal-optD').value;

            desc,

                id: newKuis.id,
                kategori: newKuis.kategori,

                soal: JSON.stringify(newKuis.soal),
                created_at: newKuis.created_at
            }]);

    async function submitJawabanKuisSiswa(e, kuisId) {
        e.preventDefault();
        const k = (APP_DATA.kuisList || []).find(x => x.id == kuisId);
        if (!k || !k.soal) return;

        let benar = 0;
        let salah = 0;

        k.soal.forEach((s, idx) => {
            const selected = document.querySelector(`input[name="soal_${idx}"]:checked`);
            if (selected && selected.value === s.kunci) {
                benar++;
            } else {
                salah++;
            }
        });

        const score = Math.round((benar / k.soal.length) * 100);
        const namaSiswa = currentUser ? normalizeName(currentUser.name) : 'SISWA';

        const attemptData = {
            id: Math.floor(Date.now() / 1000),
            studentName: namaSiswa,
            quizId: k.id,
            quizTitle: k.judul,
            score,
            totalCorrect: benar,
            totalWrong: salah,
            submittedAt: new Date().toLocaleString('id-ID')
        };

        if (!APP_DATA.kuisScores) APP_DATA.kuisScores = [];
        APP_DATA.kuisScores.push(attemptData);
        saveDB();

        if (_supabase) {
            const { error } = await _supabase.from('quiz_attempts').insert([{
                id: attemptData.id,
                student_name: namaSiswa,
                quiz_id: k.id,
                quiz_title: k.judul,
                score,
                total_correct: benar,
                total_wrong: salah,
                submitted_at: attemptData.submittedAt
            }]);
            handleSupabaseError(error, "Simpan Skor Asesmen");
        }

        showToast(`Asesmen Selesai! Skor Anda: ${score}`);
        document.getElementById('containerSoalSiswa').innerHTML = `
            <div class="card" style="text-align:center;">
                <h3 style="color:var(--primary-purple); font-size:24px; font-weight:800;">🎉 Skor Akhir: ${score}</h3>
                <p>Jumlah Benar: <b style="color:#059669;">${benar}</b> | Jumlah Salah: <b style="color:#DC2626;">${salah}</b></p>
            </div>
        `;
        loadRiwayatKuisSiswa();
    }
    window.submitJawabanKuisSiswa = submitJawabanKuisSiswa;

    function loadRiwayatKuisSiswa() {
        const container = document.getElementById('containerRiwayatKuisSiswa');
        if (!container || !currentUser) return;
        const namaSiswa = normalizeName(currentUser.name);
        const myScores = (APP_DATA.kuisScores || []).filter(qs => normalizeName(qs.studentName || qs.student_name) === namaSiswa);

        if (myScores.length === 0) {
            container.innerHTML = `<p style="color:var(--text-light);">Belum ada riwayat asesmen.</p>`;
            return;
        }

        let html = `<div class="table-responsive"><table><thead><tr><th>Judul Asesmen</th><th>Skor</th><th>Benar</th><th>Salah</th><th>Waktu</th></tr></thead><tbody>`;
        myScores.forEach(qs => {
            html += `<tr>
                <td><strong>${qs.quizTitle || qs.quiz_title}</strong></td>
                <td><span class="badge badge-purple" style="font-size:14px; font-weight:bold;">${qs.score}</span></td>
                <td style="color:#059669; font-weight:bold;">${qs.totalCorrect !== undefined ? qs.totalCorrect : qs.total_correct}</td>
                <td style="color:#DC2626; font-weight:bold;">${qs.totalWrong !== undefined ? qs.totalWrong : qs.total_wrong}</td>
                <td>${qs.submittedAt || qs.submitted_at}</td>
            </tr>`;
        });
        html += `</tbody></table></div>`;
        container.innerHTML = html;
    }

    // ============================================================
    //  INITIAL ON LOAD - PASTIKAN DATA DIAMBIL
    // ============================================================
    window.addEventListener('DOMContentLoaded', async () => {
        await loadAllDataFromSupabase();
        console.log("✅ LMS Siap - Data telah dimuat dari Supabase");
    });
</script>
