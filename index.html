<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS Informatika - Buat Pertemuan</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f3f0ff; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { color: #5b21b6; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #5b21b6; }
        input, select { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 5px; box-sizing: border-box; }
        .row { display: flex; gap: 20px; }
        .col { flex: 1; }
        .btn-submit { width: 100%; background-color: #7c3aed; color: white; padding: 15px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .btn-submit:hover { background-color: #6d28d9; }
        .error-msg { color: red; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h2>✨ Buat Pertemuan Baru</h2>

    <div class="form-group">
        <label>Kelas</label>
        <select id="kelas">
            <option value="X Keramik A">X Keramik A</option>
        </select>
    </div>

    <div class="form-group">
        <label>Judul</label>
        <input type="text" id="judul" value="Pertemuan 2 - Algoritma Pencarian">
    </div>

    <div class="row">
        <div class="col">
            <div class="form-group">
                <label>Materi Ajar</label>
                <input type="file" id="materiFile">
            </div>
        </div>
        <div class="col">
            <div class="form-group">
                <label>LKPD</label>
                <input type="file" id="lkpdFile">
            </div>
        </div>
    </div>

    <button class="btn-submit" id="btnTerbitkan">Terbitkan</button>
    <div id="status" class="error-msg"></div>
</div>

<!-- Import Supabase JS V2 -->
<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';

    // KONFIGURASI (Sudah diisi sesuai data Anda)
    const SUPABASE_URL = 'https://gbfcgapcfpihhghdhakj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_czXnEOXu4dDc34CbUrhBtw_o7KetzcD';
    
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // BUCKET TARGET
    const BUCKET_NAME = 'lms-files';

    // FUNGSI UNTUK MEMASTIKAN BUCKET ADA (MENGATASI ERROR NULL)
    async function ensureBucketExists() {
        // Ambil daftar bucket
        const { data: buckets, error: bucketErr } = await supabase.storage.listBuckets();

        // Jika error null atau data tidak ada (null), langsung buat bucket baru
        if (bucketErr || !buckets || !Array.isArray(buckets)) {
            console.warn("Bucket tidak ditemukan, membuat bucket baru...");
            await supabase.storage.createBucket(BUCKET_NAME, { public: true });
        } else if (!buckets.some(b => b.name === BUCKET_NAME)) {
            // Jika data ada tapi bucket 'lms-files' tidak ada di daftar
            console.log("Bucket lms-files belum ada, membuat baru...");
            await supabase.storage.createBucket(BUCKET_NAME, { public: true });
        }
    }

    // FUNGSI UPLOAD FILE
    async function uploadFile(file, folderName) {
        if (!file) return null;

        // Pastikan bucket ada sebelum upload
        await ensureBucketExists();

        // Buat path unik agar nama file tidak tabrakan
        const filePath = `${folderName}/${Date.now()}_${file.name}`;

        // Proses Upload
        const { error: uploadError } = await supabase.storage
            .from(BUCKET_NAME)
            .upload(filePath, file, { upsert: false });

        if (uploadError) {
            throw new Error(`Gagal upload file ${file.name}: ${uploadError.message}`);
        }

        // Ambil URL Publik
        const { data: urlData } = supabase.storage
            .from(BUCKET_NAME)
            .getPublicUrl(filePath);

        return urlData.publicUrl;
    }

    // FUNGSI UTAMA SAAT TOMBOL DIKLIK
    document.getElementById('btnTerbitkan').addEventListener('click', async () => {
        const statusEl = document.getElementById('status');
        statusEl.textContent = "Memproses upload...";

        try {
            const materiFile = document.getElementById('materiFile').files[0];
            const lkpdFile = document.getElementById('lkpdFile').files[0];
            const judul = document.getElementById('judul').value;
            const kelas = document.getElementById('kelas').value;

            // Upload Materi Ajar
            const materiUrl = await uploadFile(materiFile, 'materi_ajar');
            
            // Upload LKPD
            const lkpdUrl = await uploadFile(lkpdFile, 'lkpd');

            // (CATATAN: Jika Anda punya tabel database untuk menyimpan data ini)
            // const { error: dbError } = await supabase
            //     .from('pertemuan')
            //     .insert([{ kelas: kelas, judul: judul, materi_url: materiUrl, lkpd_url: lkpdUrl }]);
            //
            // if (dbError) throw new Error(dbError.message);

            statusEl.style.color = "green";
            statusEl.textContent = `Berhasil! URL Materi: ${materiUrl} | URL LKPD: ${lkpdUrl}`;
            alert("Pertemuan berhasil diterbitkan!");
            location.reload();

        } catch (error) {
            console.error(error);
            statusEl.style.color = "red";
            statusEl.textContent = `Gagal: ${error.message}`;
        }
    });
</script>

</body>
</html>
